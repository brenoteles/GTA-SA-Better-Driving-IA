[Settings]
; Velocidades "Cruise" estao na unidade da IA do jogo (1 = 3 km/h). Ex.: 30 = 90 km/h
; Velocidades em km/h estao indicadas. Aceleracoes em m/s2, distancias em metros

; ---- Debug ----
; 1 = mostra texto/linhas de debug sobre os veiculos e um contador no canto da tela
;   linhas verdes/vermelhas = sensores (vermelho = obstaculo; amarelo = parede longe, ignorada)
;   linha azul = rota da IA a frente; magenta = ponto (curva/cruzamento) que esta limitando a velocidade
TestMode = 1
; 1 = compacto: uma linha curta por veiculo (perfil, velocidade > alvo, o que limita, < > seta, PASS ultrapassando,
;     CHG trocando de faixa, YIELD abrindo espaco), na cor do perfil; sensores, rota e reservas so no veiculo mais perto
;     da camera (o que voce esta acompanhando). 2 = completo (tudo em todos os veiculos)
DebugLevel = 1
; Tecla do debug em jogo (codigo virtual-key): desligado -> compacto -> completo -> desligado. 120 = F9. 0 = desativado
DebugToggleKey = 120
; So mostra o debug de veiculos ate essa distancia da camera
DebugDistance = 40.0

; ---- Comportamento ----
OnlyInNormal = 0
FixGroundStuck = 1
; Tentativas de reposicionar um veiculo preso no chao antes de colocar ele de volta na rota
GroundStuckAttempts = 6
UseBikeLogicOnCars = 0
UseBikeLogicOnBicycles = 1
BicyclesDontStopForRed = 0
NoBicycleHorns = 1
CheckObjects = 0
; Onibus, caminhoes e veiculos lentos andam na faixa da direita
SlowVehiclesSlowLane = 1
; Carros perto do jogador (ou com o jogador acima de 80 km/h) nao trocam de faixa sozinhos
AvoidVehiclesChangingLane = 1

; ---- Velocidade ----
TurningSpeedDecrease = 15.0
CruiseMinSpeed = 3.0
; Velocidade maxima (unidade Cruise) quando RoadSpeedLimits = 0
CruiseMaxSpeed = 30.0
BicycleSpeedMult = 0.5
BicycleCruiseMaxSpeed = 10.0

; ---- Curvas ----
; Desliga o freio de curva da IA do jogo (que reduz a velocidade so pelo angulo, tarde e sem considerar
; o carro) e usa o do mod no lugar. O freio do jogo para carros a frente/semaforo/passagem de trem continua
ReplaceGameCurveBraking = 1
; Limita a velocidade pela curva que o carro esta fazendo agora (volante e giro real x aderencia)
HeadingLimiter = 1
; Limitador de curva em andamento: aderencia = a da curva x este fator (so uma rede de seguranca, nao freia de novo)
HeadingGripMargin = 1.35
; Curvas: fracao da aderencia REAL do carro (aprendida por modelo) que o motorista usa, de calmo (Min) a agressivo (Max).
; Em rodovias x1.1 (max 0.92). O CornerGrip do perfil vira o minimo
CurveGripUseMin = 0.55
CurveGripUseMax = 0.85
; Frenagem antes de curvas e semaforos: fracao da frenagem real do carro (calmo..agressivo)
CurveBrakeUseMin = 0.45
CurveBrakeUseMax = 0.65
; Pedido de passagem (piscando o farol alto): so na faixa da esquerda, e so se quem pede quer andar pelo menos
; isto (km/h) mais rapido que o da frente. O da frente vai para a direita se puder
PassRequestMinDiff = 20.0
; Freio de mao em curvas fechadas de cruzamento: motoristas acima do normal (rapido, agressivo, fuga, desempenho maximo)
; em carros comuns entram mais rapido (x HandbrakeEntryBoost) e puxam o freio de mao para girar o carro
HandbrakeTurns = 1
HandbrakeEntryBoost = 1.0
; Saiu da rota (o jogo pegou outra saida): ao planejar de novo, as vias da rota antiga custam isto (x o tempo):
; o carro volta para ela, a menos que outro caminho seja bem melhor
RejoinRouteFactor = 0.6
; Correcoes de faixas vindas da varredura da rota (RealTrafficFix.routefixes.txt, gerado por tools\route_scan.py)
RouteFixes = 1
; Ultrapassagens planejadas com o que os carros "contam" uns aos outros (V2V): posicao, velocidade e a velocidade que cada
; um quer. Calcula a manobra inteira (tempo, onde cada carro da outra faixa vai estar) e so vai se couber
V2VOvertakes = 1
; Cruzamento a frente sem saida planejada (fora da rota): nao mais rapido que a saida mais fechada, nem mais lento que isto
UnplannedJunctionSpeed = 45
; Cruzamentos sem semaforo na cidade: quem chega primeiro passa primeiro (como um "4-way stop"). So espera quando ha
; alguem vindo de outra direcao que chegou antes
JunctionFirstCome = 1
; Trafego ambiente (como jogos modernos): carros criados nas vias em volta do jogador, fora da visao (atras, dos lados,
; ruas laterais), ja andando, ate AmbientSpawnFill x o limite de carros aleatorios do jogo (VehLimit do MixSets)
AmbientSpawn = 1
AmbientSpawnMinDist = 80
AmbientSpawnMaxDist = 220
AmbientSpawnInterval = 100
AmbientSpawnTarget = 70
; Metros de faixa por carro: o alvo acima nunca passa do que as vias num raio de 250 m comportam (faixas x comprimento /
; este valor). Tambem nao cria carro numa via com carro parado ou cheia (mais de 1 carro a cada 25 m de faixa)
AmbientLaneSpacing = 45
; Distancia (m) em que o jogo remove carros aleatorios: fora da visao (jogo: 45) e na visao (jogo: 170). O MixSets nao
; conseguia mudar isso aqui; o mod corrige direto no codigo do jogo (0 = nao mexe). DespawnOnScreen e multiplicado pelo
; multiplicador de distancia da camera (~0.46): 700 = ~320 m. Vale para carros fora da visao tambem
DespawnOffScreen = 300
DespawnOnScreen = 700
; Le a rota da IA a frente e freia antes das curvas
CurveLookahead = 1
MaxLookaheadDist = 150.0

; ---- Inteligencia dos pilotos (perfis com RacingLogic = 1) ----
; Planeja com antecedencia por qual saida vai sair de cada cruzamento (prefere as que da pra fazer em alta
; velocidade) e faz a IA do jogo usar essa saida, se ela for permitida. Assim nao precisa frear "por via das duvidas"
RoutePlanning = 1
; Tracado de corrida: corta as curvas usando a largura das faixas do PROPRIO sentido (nunca passa da linha central).
; So com pista livre; com transito perto quem dirige e a IA do jogo (desvio/ultrapassagem)
RacingLine = 1
; Distancia minima da borda das faixas (m), alem da metade da largura do carro
RacingLineMargin = 0.8
; Aprende a aderencia e a frenagem reais de cada modelo enquanto dirige (salvo em RealTrafficFix.limits.txt)
AdaptiveLimits = 1
; Fracao da frenagem aprendida que o piloto usa (a da aderencia e o CornerGrip do perfil)
LearnedDecelUse = 0.85

; ---- Auxilios de pilotagem ----
; ABS: alivia o freio quando a roda trava
ABS = 1
; Controle de tracao: alivia o acelerador quando a roda patina
TractionControl = 1
; Rotas tambem pelas vias que o jogo deixa sem uso (estradas de terra, desligadas nos dados do mapa); as desligadas por
; missao/historia (pontes de ilhas fechadas) continuam fora
UseUnusedRoads = 1
; Curvas rapidas: aderencia usada x este valor nas curvas boas para 110 km/h ou mais (de 60 km/h para baixo, igual)
FastCurveGripBoost = 2.0
; Rodovias e vias rapidas: distancia (em tempo) para o carro da frente x este valor (minimo 0,25 s)
HighwayGapFactor = 0.3
; Controle de estabilidade: corta o acelerador quando o carro esta derrapando de lado (> 14 graus)
StabilityControl = 1
; Contraesterco: quando a traseira escapa, vira o volante para onde o carro esta indo
CounterSteer = 1

; ---- Modelo de pilotagem ----
; Acelerador/freio proprios seguindo a velocidade alvo com precisao (as paradas do jogo por transito/semaforo continuam).
; Tambem limita a aceleracao a do perfil do motorista (sem isso todo mundo sai pe embaixo)
PedalControl = 1
; A aderencia e dividida entre frear e virar: curvando forte, freia mais cedo
FrictionCircle = 1
; Descida aumenta a distancia de frenagem, subida diminui; e reduz antes de cristas para nao decolar
SlopeAware = 1
; Fracao da velocidade de decolagem usada nas cristas (menor = mais cuidado)
CrestFactor = 0.85
; Menos aderencia em terra/grama/areia (surface.dat do jogo) e com chuva
SurfaceGrip = 1
; Perda de aderencia com a pista totalmente molhada (0.3 = 30%)
RainGripLoss = 0.3
; Carro danificado/pneu furado anda mais devagar
DamageAware = 1

; ---- Trafego ----
; Perfis de motorista (secoes [Profile.*] no fim do arquivo). 0 = todos sao "normal"
Profiles = 1
; Variacao entre motoristas do mesmo perfil (0 = todos iguais, 1 = +-6% de velocidade e +-0.1 de agressividade)
PersonalitySpread = 1.0
; Antes de entrar num cruzamento em velocidade, verifica se tem alguem cruzando
JunctionProtection = 1
; Da re de forma inteligente quando bate/fica preso; capotado ou preso de vez volta para a rua (so fora da tela)
CrashRecovery = 1
; Segundos tentando andar sem sair do lugar antes de dar re
StuckTime = 3.0
; Segundos capotado antes de ser recolocado na rua
FlipResetTime = 4.0

; ---- Semaforos ----
; Enxerga semaforos na rota a frente (nao so o do proximo trecho, como o jogo faz)
;   verde: chega no maximo a LightApproachSpeed do perfil; vermelho: para suave na faixa;
;   amarelo: para se der pra parar confortavelmente, senao passa
TrafficLightDetection = 1
; Distancia antes da linha do semaforo onde o carro para (m)
LightStopMargin = 1.5
; Distancia extra (m) parado atras de motos e bicicletas (elas balancam, param curto e caem)
BikeGapExtra = 1.5

; ---- Perfis com RacingLogic (em fuga, desempenho maximo) ----
; Velocidade maxima desejada sem limite da via (km/h). Na pratica o limite e o motor/cambio de cada carro
RacerMaxSpeed = 320.0
; Velocidade minima garantida ao chegar num cruzamento (km/h). Se todas as saidas forem suaves, nao freia
RacerJunctionSpeed = 80.0
; Comprimento dos sensores laterais do piloto (m)
RacerSideRayLength = 12.0
; Estilo de direcao dos pilotos de CARRO. 1 = reduz atras de carros e respeita semaforos (sem costurar; a
; ultrapassagem e feita trocando de faixa). 5 = costura entre os carros como moto. -1 = manter o do jogo
RacerDrivingStyle = 1
; Estilo de direcao dos pilotos de MOTO/bicicleta (5 = costura entre os carros e respeita semaforos)
RacerBikeDrivingStyle = 5

; ---- Faixas e ultrapassagem (carros) ----
; A IA do jogo troca de faixa sorteando, a cada 4-7 trechos de rua, sem olhar a faixa de destino. Com isso ligado os
; carros do mod so trocam de faixa quando o mod decide: para ultrapassar, voltar para a direita ou ir para a faixa rapida
LaneDiscipline = 1
; Ultrapassagem: so em vias com 2+ faixas no mesmo sentido (nunca pela contramao), com a faixa livre na frente e atras,
; longe de cruzamentos, semaforos e curvas. O motorista da seta, espera um pouco e so troca se a faixa continuar livre.
; Quem ultrapassa e o carro da frente mais lento que OvertakeSpeedRatio (do perfil) x a velocidade que ele quer
Overtaking = 1
; Segundos que um carro mais rapido vindo por tras na outra faixa precisa ter ate nos alcancar
OvertakeRearTime = 3.5
; Perfis com KeepRight = 1 voltam para a direita depois de ultrapassar e quando a faixa da direita esta livre
KeepRight = 1
; Durante a ultrapassagem o motorista quer andar OvertakeSpeedBoost km/h (ou 40%, o que for maior) acima do normal e
; acelera bem mais forte (ver abaixo), para passar rapido e com seguranca (sempre limitado pelo carro).
; As ultrapassagens sao coordenadas: quem ja esta ultrapassando (ou sinalizando) atras vai primeiro, o da frente espera
OvertakeBoost = 1
OvertakeSpeedBoost = 50.0
; Aceleracao durante a ultrapassagem: 1 = a maxima do veiculo (pe embaixo) ate concluir. 0 = x a do perfil, minimo OvertakeMinAccel (m/s2)
OvertakeFullThrottle = 1
; Distancia para o carro da frente menor em velocidade baixa: abaixo de FullGapSpeed (km/h) o intervalo de tempo do perfil
; cai proporcionalmente ate LowSpeedGapFactor (0.4 = 40%) parado. No anda-e-para os carros ficam mais juntos
FullGapSpeed = 55.0
LowSpeedGapFactor = 0.4
; Fila parada (semaforo, transito): o motorista vai encostando devagar ate a distancia minima do perfil (MinGap), em vez de
; parar a ~5 m como a IA do jogo faz
CloseUpInQueues = 1
OvertakeAccelMult = 2.0
OvertakeMinAccel = 4.0
; Coordenacao: antes de dar seta, o motorista reserva o trecho de via que a troca vai usar (de um pouco atras dele ate
; onde vai estar no fim da manobra, na faixa dele e na de destino). So troca se ninguem tiver reservado aquele espaco;
; assim dois carros nunca vao para o mesmo lugar, e quem ja comecou a ultrapassar vai primeiro. Reservas aparecem em
; azul-claro no debug completo
LaneChangeCoordination = 1
; Cada motorista sorteia um destino (um ponto da rede de ruas a 0.8-2 km) quando aparece e calcula a rota ate la (A*:
; tempo de viagem por tipo de via, conversao a esquerda custa mais, so no sentido permitido). A rota decide a saida de
; cada cruzamento e a faixa: ele se posiciona antes (direita para sair/virar a direita, esquerda para virar a esquerda)
Destinations = 1
; Porcentagem dos motoristas com destino numa via de 2+ faixas (de preferencia rodovia) a 1.2-2.5 km; os outros vao
; para qualquer lugar a 0.8-2 km. A rota trata vias de 1 faixa por sentido como 2x mais lentas e as vias lentas como 3x,
; entao fica nas vias largas e so sai delas quando precisa
DestinationWideRoads = 80
; Mantem os nos de via do mapa inteiro carregados (o jogo so carrega os de perto do jogador), para que as rotas possam
; ser longas, de uma cidade a outra. Mesma ideia do GTA GPS Redux (juicermv). Usa um pouco mais de memoria
LoadAllPathNodes = 1
; Segundos antes da saida/conversao para ja estar na faixa certa (no minimo 80 m)
LanePrepareTime = 12.0
; Setas (pisca-pisca): ligadas antes e durante cada troca de faixa e antes das conversoes. A troca de faixa e suave
; (5 s calmo ate 2.5 s agressivo), checando com sensores laterais; se aparecer alguem do lado ele volta para a faixa dele
TurnSignals = 1
; Motoristas cooperativos (Aggression < 0.65) que veem a seta de alguem entrando na faixa deles tiram o pe e abrem espaco
YieldToSignals = 1

; ---- Faixa bloqueada ----
; Parado atras de um veiculo que bloqueia a faixa (batido, quebrado, abandonado, ou parado sem motivo de transito),
; depois de BypassWait segundos o carro desvia dele com a logica de moto (estilo 6) a no maximo BypassSpeed km/h.
; Fila de semaforo/transito normal nao conta: so o primeiro da fila desvia, os de tras esperam ele sair
BypassBlocked = 1
BypassWait = 6.0
BypassSpeed = 20.0

; ---- Limite de velocidade por tipo de via ----
; Cada motorista quer a velocidade da via x o SpeedMult do seu perfil, sempre limitado pelo carro (velocidade maxima do
; cambio x TopSpeedUse do perfil). Tipo de via: rodovia pela classe dos nos de caminho do jogo (a mesma que deixa o
; trafego mais rapido nas rodovias); senao pelas faixas: 3+ no sentido = via rapida, 2 = avenida, 1 em cada sentido =
; rua (ou estrada rural, se nao tiver cruzamento nos proximos RuralJunctionDist m), faixa unica = viela; terra/grama = terra
RoadSpeedLimits = 1
RoadSpeedHighway = 150.0
RoadSpeedFastRoad = 140.0
RoadSpeedAvenue = 120.0
RoadSpeedRural = 125.0
RoadSpeedStreet = 75.0
RoadSpeedNarrow = 50.0
RoadSpeedDirt = 60.0
RuralJunctionDist = 250.0
; Onibus, caminhoes e veiculos lentos
RoadSpeedBigMult = 0.85
; Aceleracao por tipo de via (x a aceleracao do perfil): em rodovia/via rapida o motorista acelera mais forte
; (entrando na rodovia, saindo de curva) do que em rua e viela
AccelHighway = 1.35
AccelFastRoad = 1.25
AccelRural = 1.15
AccelAvenue = 1.1
AccelNarrow = 0.85
AccelDirt = 0.9
; Aderencia nas curvas de rodovia, via rapida e estrada rural (x a do perfil): vias feitas para velocidade
FastRoadCornerGrip = 1.35
; Semaforo verde: passa na velocidade da via (amarelo/vermelho continuam sendo tratados)
GreenLightFullSpeed = 1

; ---- Desempenho ----
; Sensores rodam a cada N frames (perto) / N frames (longe da camera)
SensorInterval = 2
SensorIntervalFar = 5
SensorFarDistance = 60.0

; ---- Deteccao de obstaculos ----
; O sensor central segue o relevo em trechos de ~25m, a essa altura do chao (m)
SensorHeight = 0.8
; Colisao com superficie virada para cima mais que isso e chao/rampa/lombada, nao parede (0 a 1)
WallNormalZ = 0.6
FrontMultDist = 50.0
SidesSpeedOffsetDiv = 70.0
CheckGroundHeight = 0.5
FinalGroundHeight = 0.5
HeightDiffLimit = 3.0

; ---- Buzinas ----
; Chance de buzinar = 1 / HornsThreshold
HornsThreshold = 100

; ---- Lombadas (mod de lombadas instalado) ----
BumpModelStart = 0
BumpModelEnd = 0
SearchBumpFramesDelay = 30
BumpSearchRadius = 6.0
BumpSearchDistMult = 0.3
BumpSpeedDiv = 1.5

; ==================================================================================================================
; PERFIS DE MOTORISTA
; Cada motorista recebe um perfil quando o carro aparece, sorteado pelos Chance (pesos relativos). O sorteio muda com
; o veiculo: onibus, caminhoes e bicicletas so tem perfis calmo/seguro/normal; policia/ambulancia/bombeiros (sem
; sirene) quase sempre seguro/normal; carros esportivos (> 190 km/h) atraem os perfis rapidos; gangues dirigem mais
; forte (3x mais chance dos perfis rapidos).
;   Chance              peso no sorteio (0 = ninguem)
;   SpeedMult           velocidade desejada = velocidade da via x isso
;   Acceleration        aceleracao maxima que o motorista usa (m/s2). 6 ou mais = pe embaixo (sem limite).
;                       Referencia: carro comum 0-100 em ~10 s = 2.8 m/s2 pe embaixo; no dia a dia 1.5-2.5
;   Deceleration        frenagem confortavel (m/s2): curvas, semaforos, carro da frente. Emergencia usa mais
;   TimeGap / MinGap    distancia para o carro da frente: segundos andando / metros parado
;   CornerGrip          aceleracao lateral nas curvas (fracao da gravidade x tracao do pneu). 0.3 = bem devagar,
;                       0.6 = forte. Perfis com RacingLogic: fracao da aderencia aprendida do modelo
;   TopSpeedUse         fracao da velocidade maxima do carro que o motorista aceita usar
;   OvertakeSpeedRatio  ultrapassa quem estiver abaixo dessa fracao da velocidade que quer (0 = nunca ultrapassa)
;   LaneChangeInterval  segundos minimos entre duas trocas de faixa
;   Aggression          0 a 1: amarelo (freia ou passa), firmeza nos pedais, margens e duracao das trocas de faixa
;                       (5 s calmo ate 2.5 s agressivo), tempo atras do mais lento antes de ultrapassar (5 s ate 1.5 s)
;   KeepRight           2 = sempre a direita (esquerda so para pegar uma saida, nao ultrapassa; cede passagem), 1 = volta para a direita (padrao: esquerda = ultrapassagem, direita = trafego normal),
;                       0 = fica na faixa, -1 = prefere a faixa da esquerda
;   LightApproachSpeed  velocidade maxima passando por um semaforo verde (km/h)
;   RacingLogic         1 = planeja a rota, usa tracado de corrida e os limites aprendidos do carro
;   IgnoreRoadSpeed     1 = ignora o limite da via (so curvas e o carro limitam)
;   RunRedLights        1 = nao para no vermelho (ainda reduz se tiver alguem cruzando)

