; Proving ground (ProvingGround.h) on the proving grid (tools/make_gridmap.py: a new flat platform, 10 m grid, tarmac,
; x -100..2900, y -2950..-1750, z 300, high above LS's airport and the sea south of it). Copied to the game's scripts folder by
; tools/proving.py; while the game runs, every 'python tools/proving.py push' starts the program over (no rebuild/restart).
; Results: scripts\proving\<date_time>\summary.txt, one CSV per run (python tools/proving.py report).
; Course frame: x along the heading (degrees from east, counter-clockwise), y to its left. Steering > 0 is to the left.

[Proving]
Origin = 1400, -2350, 300
Heading = 0
AreaRadius = 2500
Cars = 411
Tests = circuit
; cjai: CJ at the wheel, the AI's physics (the traffic's); ai: an AI driver, CJ beside it; player: CJ with the player's physics
; human: you drive car A (the game's controls), scored with the others as HUMANO, a 3 s countdown; cjai: CJ with the AI's code
Driver = human
; Cars on the same course at once (A is CJ's; B, C... AI drivers), each LaneShift m to the right of the one before, with
; [Steer.B] / [Speed.B] (C, D... J) over A's settings; with [GA] each one is an individual of the population
Runners = 60
LaneShift = 115
; 10 lanes a deck: z 300, 380, ... 700 (tools/make_gridmap.py DECKS)
LanesPerDeck = 10
DeckHeight = 80
Grid = 1
GridSize = 10
ExitWhenDone = 0
Pause = 0
; > 0: the AI car's m_fCarTraction (1 normally; a mission script can change it)
CarTraction = 0

[Steer]
; kinematic | pursuit | stanley | mod (the mod's own predictive steering, LaneControllerSteer)
Mode = kinematic
LookaheadTime = 0.6
LookaheadMin = 6
LookaheadMax = 60
Gain = 1.0
; kinematic: wheel = atan(L k), k = course curvature (Preview s ahead) - Bandwidth^2/v^2 offset - 2 Damping Bandwidth/v sin(heading error)
; (offset and heading at the rear axle): the error decays like a spring of Bandwidth rad/s at every speed
Bandwidth = 1.5
Damping = 1.0
Preview = 0.03
StanleyK = 1.5
StanleySoft = 2.0
FeedForward = 1
; rad; 0 = the handling's steering lock
MaxSteer = 0
; rad/s; 0 = unlimited
SteerRate = 0
; s (first-order lag on the wheel)
Smoothing = 0
; > 0: never more wheel than G g needs at this speed: atan(L G g / v^2)
GripClampG = 0
; mode = mod: the racing driver's weights
Racer = 1

[Steer.B]

[Speed]
Kp = 0.35
BrakeKp = 0.6
CruiseGas = 0.15
; > 0: slow down for the course's curves to GripG g, braking for them at BrakeG g (a test can set its own)
GripG = 0
BrakeG = 1.1
; a test's GripG = 0: this share of the car's AI grip computed from the game's formula (10 x adhesive x tractionMult m/s2)
GripFactor = 0.42
; the grip by the kind of curve (x in tight ones <= 15 m, x in fast ones >= 150 m) and how fast each car learns it while it
; drives (per s; 0 = never): the GA tunes all three
GripTight = 1.0
GripFast = 1.0
LearnRate = 0.1
; ABS (the GA tunes these; each car also learns its own limit on the way, at LearnRate): pedal at AbsMargin of the
; wheels' lock point, x the friction circle's share by AbsCircle; a lock takes AbsDrop off, AbsRecover a frame back
AbsMargin = 0.9
AbsDrop = 0.15
AbsRecover = 0.05
AbsCircle = 1
; TC: no gas past TcSlip rad of slip at the rear axle; in a curve at least TcMinGas, the friction circle's share by
; TcCircle; spinning wheels take TcDrop off, TcRecover a frame back
TcSlip = 0.08
TcMinGas = 0.15
TcDrop = 0.1
TcRecover = 0.03
TcCircle = 1
; no gas past the grip a curve leaves (friction circle), none while sliding
TractionControl = 1
; brake pedal under the wheels' lock point (no ABS in GTA: a locked wheel loses its sideways grip) and the curve's grip
ABS = 1
AbortOffset = 25

[Speed.B]

; --- Genetic algorithm (ProvingGround.h, GA): every car is one individual; a generation is one pass over the tests ---
; Genome: Mode (one of Modes) and Bandwidth, Damping, Preview, LookaheadTime, LookaheadMin, StanleyK, Gain, Smoothing,
; GripFactor, BrakeG, Kp, BrakeKp. Car A of the first generation is [Steer]/[Speed] above, B.. one of each mode, then random.
; Score (lower is better): time + EdgePenalty x m.s the body was closer than EdgeComfort m to the road's edge (a test
; with Width: its corridor) + OffPenalty x s with the body past the edge (no Width: further than OffLimit m from the
; centre) + MeanPenalty x mean offset from the centre (0: anywhere inside the road with room is fine, as in traffic)
; + RmsPenalty x rms offset; not finished:
; 1000 + 0.5 per m short + OffPenalty x s out. scripts\proving\ga_state.txt (Resume), ga_history.csv, ga_best.ini,
; ga_trace\gen_NNNN.csv (tools/ga_review.py: Gemini's review every few generations, SQLite, the HTML viewer)
[GA]
Enabled = 1
; gt4: a line and speed profile worked out before the run, followed (after Gran Turismo 4's AI); mpc: 15 wheel
; angles simulated ahead every frame, the best kept
; neural: a small network (11 rays to the road's edges, speeds, wheel, curvature ahead -> wheel, pedal) whose weights
; the GA evolves (after LucasHJin/self-play-racing); it can start from a human's lap (tools/nn_clone.py)
Modes = kinematic, stanley, pursuit, mod, gt4, mpc, neural
; a neural weight's mutation
NnSigma = 0.05
; islands: every algorithm at least this many cars, bred among its own (a new one gets the time to be tuned)
MinPerMode = 7
Elite = 6
Tournament = 3
; (0: no random newcomers, the user wants no abrupt changes in the brains)
Immigrants = 0
MutationRate = 0.3
; gentle steps: 5% of a gene's range
Sigma = 0.05
SigmaDecay = 0.98
SigmaMin = 0.01
; (0: a brain does not jump to another algorithm)
ModeMutation = 0
OffLimit = 2
MeanPenalty = 0
EdgeComfort = 0.3
EdgePenalty = 5
; (40: at 10 a second outside cost less than what cutting the spiral and the U-turn gained; the user raised it)
OffPenalty = 40
RmsPenalty = 0
; 0 = no end
Generations = 0
Resume = 1
Seed = 0
; 1 = also the full CSV of every car (~10 MB a generation)
Csv = 0

; --- Tests -------------------------------------------------------------------------------------------------------------
; Shape: line | circle | figure8 | slalom | lanechange | track (Segments = "S 300 / L 90 30 / R 45 120": straight m,
; left/right degrees radius) | points.  Speed: km/h list, one run each (held; with GripG the most it goes).
; StartSpeed: km/h at the start (default: Speed). Open loop (the course is only drawn): Steer = step | ramp | sine | sweep
; | hold, SteerAmp (rad), SteerStart (s), SteerRate (rad/s), Freq / FreqEnd (Hz). Pedal = hold | full | coast | brake
; (BrakeLevel, BrakeTo km/h then held) | lift, PedalStart (s). Start = x, y, heading: the test's own place.

; Every test in one course, from a standstill (5.1 km, 97 m wide: y -9..+88 of its lane; lanes 115 m apart, 10 a deck).
; Pieces (track): S m | L/R degrees radius | W amplitude spacing gates (slalom) | J amplitude out hold back (lane change,
; moose) | V km/h m (posted limit, planned for) | B km/h m (sudden brake, unseen until there) | X m/s2 m (crosswind, > 0
; pushing left) | N name
[Test.circuit]
Shape = track
Start = -60, -1850, 0
StartSpeed = 0
; no top speed: as fast as the car goes where the line allows (the curves, the brakes and the limits ahead set it)
Speed = 9999
GripG = 0
Duration = 600
; the road: a one-way lane of 4 m between its edges (traffic: the car keeps its whole body inside, ~1 m each side of an
; Infernus; the centre line is only a guide)
Width = 4
; 350 m straight from the start (the traction control's test, launching flat out)
Segments = N Largada / S 350
Segments2 = N Slalom / W 3 40 10 / S 80
; (no speed limit: the AI works out its own speed from the line, as everywhere)
Segments3 = N Alce / S 60 / J 3.5 13.5 11 12.5 / S 40
Segments4 = N Chicane fechada / S 60 / R 45 15 / L 90 15 / R 45 15 / S 120
; (no sudden brakes: the user took them out)
Segments5 = N Curva longa / L 20 220 / R 20 220 / R 20 220 / L 20 220
; the fast straight: 1200 m bends and a 1.8 m lane change at 300+ km/h, then crosswind gusts (small corrections at
; top speed, as on a motorway)
Segments6 = N Reta rapida / L 4 1200 / R 8 1200 / L 4 1200 / J 1.8 120 80 120 / N Vento lateral / X 2.5 180 / S 220 / X -2.5 140 / S 200 / S 100
; a double spiral (the Debian swirl): arcs of 45 m down to 7 m (from ~100 km/h to ~35), then opening out again to 45 m
Segments7 = N Espiral / L 90 45 / L 90 34 / L 90 25 / L 90 18 / L 90 13 / L 90 9 / L 90 7 / L 90 7 / R 90 7 / R 90 7 / R 90 9 / R 90 13 / R 90 18 / R 90 25 / R 90 34 / R 90 45 / S 80
Segments8 = N U-turn / R 180 7 / S 150
Segments9 = N Zig-zag / L 30 40 / R 60 25 / L 60 15 / R 60 40 / L 60 30 / R 60 20 / L 30 35 / S 80
Segments10 = N Z fechado / L 90 12 / S 8 / R 90 12 / S 40 / R 90 15 / L 90 15 / S 100
Segments11 = N Duplo 90 / L 90 18 / S 15 / R 90 18 / S 120
Segments12 = N Chicane rapida / L 25 60 / R 50 60 / L 25 60 / S 150
Segments13 = N Curva fechada / R 80 25 / R 10 25 / L 90 25 / S 150
Segments14 = N Slalom variavel / L 30 60 / R 60 60 / L 65 45 / R 70 45 / L 75 30 / R 80 30 / L 85 22 / R 90 22 / L 45 22 / S 120
Segments15 = N Chegada / S 60

